# Yapper light theme
# Backgrounds and text come from the macOS light theme.
# The brand violet is a bit deeper here so it keeps its contrast on white.

@accentColor = #5B4BDB

# Custom Yapper colors, used from component styles in the code
@yapperSurface = #FFFFFF
@yapperOnAccent = #FFFFFF
@yapperHighlight = #5B4BDB
@yapperLink = #5B4BDB
@yapperError = #D32F2F

Component.focusedBorderColor = #5B4BDB

# Readable from Java code (for icon colors)
Yapper.highlight = @yapperHighlight
