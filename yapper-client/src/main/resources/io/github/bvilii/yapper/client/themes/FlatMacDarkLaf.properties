# Yapper dark theme
# Backgrounds and text come from the macOS dark theme.
# The brand color is a soft violet with a lighter tint for text on dark backgrounds.

@accentColor = #7C6CF2

# Custom Yapper colors, used from component styles in the code
@yapperSurface = lighten(@background,5%)
@yapperOnAccent = #FFFFFF
@yapperHighlight = #A99FFF
@yapperLink = #A99FFF
@yapperError = #FF6B6B

Component.focusedBorderColor = #A99FFF

# Default buttons (the one Enter presses, e.g. Create) use the brand colors
Button.default.background = @accentColor
Button.default.foreground = @yapperOnAccent

# Readable from Java code (for icon colors)
Yapper.highlight = @yapperHighlight

# Chat screen: the room list (sidebar) is the darker side, the chat is the lighter one
@yapperSidebar = @background
@yapperChat = lighten(@background,5%)

# Background of a room card in the room list, a bit lighter than the sidebar
Yapper.roomCardBackground = lighten(@yapperSidebar,3%)
