# Yapper dark theme
# Backgrounds and text come from the macOS dark theme.
# The brand color is a soft violet with a lighter tint for text on dark backgrounds.

@accentColor = #7C6CF2

# Custom Yapper colors, used from component styles in the code
@yapperSurface = lighten(@background,5%)
@yapperOnAccent = #FFFFFF
@yapperHighlight = #A99FFF
@yapperLink = #A99FFF
@yapperError = #FF6B6B

Component.focusedBorderColor = #A99FFF

# Readable from Java code (for icon colors)
Yapper.highlight = @yapperHighlight
